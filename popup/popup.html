<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Translator</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="popup.css">
</head><body class="popup">
  <header class="popup-header">
    <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 6.5C9 4.5 5.5 4.5 3 5.5v14c2.5-1 6-1 9 1 3-2 6.5-2 9-1v-14c-2.5-1-6-1-9 1Z"/><path d="M12 6.5v14M6 9l3 1M6 13l3 1m6-4 3-1m-3 5 3-1"/></svg></div>
    <div class="brand-copy"><h1>Manga Translator</h1><p>Image &amp; page translation</p></div>
    <button id="settings" class="settings-button" title="Open Settings" aria-label="Open Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.7 2.4-2.4 1L3.7 6 2 9l1.7 1.7v2.6L2 15l1.7 3 2.2-.4 2.4 1L9 21h6l.7-2.4 2.4-1 2.2.4 1.7-3-1.7-1.7v-2.6L22 9l-1.7-3-2.2.4-2.4-1L15 3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <section class="status-card" aria-label="Translation status">
    <span class="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite">Checking configuration…</p><span class="local-badge">BYOK</span>
  </section>
  <section class="actions" aria-label="Page controls">
    <button id="page" class="translate-button">
      <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg></span>
      <span class="action-copy"><strong>Translate page</strong><span>All loaded images on this page</span></span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
    </button>
    <div class="secondary-actions">
      <button id="stop" class="secondary" title="Cancel the current request and remaining images"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop translation</span></button>
      <button id="restore" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v6h6M4 11a8 8 0 1 1 1 7"/></svg><span>Restore originals</span></button>
    </div>
  </section>
  <section class="shortcut-card" aria-labelledby="shortcut-title">
    <div class="shortcut-heading"><h2 id="shortcut-title">Just one image?</h2><span class="shortcut"><kbd>Alt</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>Z</kbd></span></div>
    <p>Hover over an image and click <strong>Translate</strong>, or use the keyboard shortcut.</p>
  </section>
  <footer>Also available from an image’s right-click menu.</footer>
  <script src="popup.js"></script>
</body></html>
